services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_dev
      POSTGRES_DB: recovery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  pgdata:
