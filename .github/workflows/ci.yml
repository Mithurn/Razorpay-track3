name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev
          POSTGRES_DB: aegis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://aegis_app:aegis_dev@localhost:5433/aegis
      ADMIN_DATABASE_URL: postgres://aegis:aegis_dev@localhost:5433/aegis
      REDIS_URL: redis://localhost:6380

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database schema
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
